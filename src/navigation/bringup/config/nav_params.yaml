bt_main_node:
  ros__parameters:
    map_topic: /map
    local_costmap_topic: /local_costmap
    goal_topic: /goal_pose
    cmd_vel_topic: /cmd_vel
    path_topic: /plan
    status_topic: /nav_status
    command_topic: /nav_command
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    control_rate: 10.0
    status_rate: 5.0

    # global planner
    robot_radius: 0.18          # ***车体半径 18cm***footprint radius [m]
    inflation_radius: 0.40      # 半径 + 0.22m 安全余量，避免贴墙
    plan_resolution: 0.10       # planning grid resolution [m]
    allow_unknown: false        # false -> unknown cells of /map are obstacles
    clearance_weight: 3.0       # 避墙代价：越大越往通道中间走
    smoothing_clearance: 0.28   # 路径平滑时必须保留的最小离墙距离 [m]
    max_expansions: 300000
    plan_time_budget: 2.0       # seconds before A* gives up

    # local controller (DWA)
    # 提高速度上限；光滑地面若出现空转，再适当回调 max_linear/max_dv
    max_linear: 0.50
    max_angular: 1.10
    lookahead_dist: 0.65
    goal_tolerance: 0.12       # 到点距离阈值，稍微收紧，避免扫过目标就停车
    goal_yaw_tolerance: 0.35   # 到点后允许的朝向误差 [rad]
    goal_hold_time: 1.0        # 到点后必须保持稳定 1 秒才算成功
    goal_slow_radius: 0.6      # 距目标 0.6 m 内线性降速，减少冲过头
    rotate_in_place_error: 0.8 # 航向偏差超过此值先原地转，避免走前进弧线画 C
    rotate_in_place_gain: 1.0
    path_heading_weight: 0.15  # 轨迹末端与路径切向的一致性权重
    curvature_weight: 0.05     # 抑制大角速度弧线，减少左右来回摆
    sim_time: 1.2
    max_dv: 0.18    #线速度的变化率（每控制周期）
    max_dw: 0.70    #角速度的变化率（每控制周期）
    dwa_heading_weight: 0.50
    dwa_clearance_weight: 0.40   # 提高离墙权重，减少贴墙
    dwa_path_weight: 0.25
    dwa_speed_weight: 0.10
    collision_cost: 30.0    # 与 robot_radius 对应的膨胀代价阈值
    unknown_cost: 10.0      # 未知格代价（低于碰撞阈值）
    local_plan_distance: 1.5    # 局部 A* 最远目标距离
    local_replan_period: 0.4    # 局部绕行路径重算周期
    local_blocked_cost: 30.0    # 局部 A* 障碍阈值
    blocked_timeout: 0.6        # seconds blocked before recovery
    max_navigation_attempts: 3  # total planning attempts before giving up

    # escalating recovery: clear path -> wait -> back up -> spin -> relocalize
    recovery_wait: 1.2     #先等X秒
    recovery_backup_distance: 0.35   #再后退y米
    recovery_backup_speed: 0.12
    recovery_spin_duration: 1.8
    recovery_spin_speed: 0.6
    recovery_relocalize: true
    relocalize_service: /reinitialize_global_localization
