amcl:
  ros__parameters:
    use_sim_time: false

    # frames / topics
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /scan
    map_topic: /map

    # motion model (differential drive)
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2   #对轮式里程计的不信任程度

    # laser model
    laser_model_type: likelihood_field
    laser_max_range: 12.0
    laser_min_range: 0.2
    laser_likelihood_max_dist: 2.0
    max_beams: 90
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1

    # particle filter
    min_particles: 500
    max_particles: 3000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    update_min_d: 0.10
    update_min_a: 0.10

    # output / timing
    tf_broadcast: true
    transform_tolerance: 1.0
    save_pose_rate: 0.5

    # initial pose: overwritten from the GUI or RViz "2D Pose Estimate"
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
